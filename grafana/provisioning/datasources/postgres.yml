# Grafana 启动时自动连上数据库和日志平台，不用手动配置
apiVersion: 1
datasources:
  - name: TradeWatch
    uid: tradewatch-pg
    type: grafana-postgresql-datasource
    url: postgres:5432
    user: tradewatch
    isDefault: true
    jsonData:
      database: tradewatch
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
    secureJsonData:
      password: $POSTGRES_PASSWORD

  - name: Loki
    uid: tradewatch-loki
    type: loki
    url: http://loki:3100
    jsonData:
      maxLines: 1000
