# TradeWatch：一个缩小版的多 PM 对冲基金交易环境
# 启动：docker compose up -d --build      停止：docker compose down
# 密码等配置放在 .env（不上传 GitHub），参考 .env.example
#
# 交易链路（每一段是一个容器，中间用 Kafka 传消息）：
#   market-data → oms（策略 + 风控，C#）→ ems（TWAP，C#）→ fix-gateway → broker-sim（券商）
#   order-store 把所有消息写进 PostgreSQL；monitor 盯着数据库和 Kafka 发告警；console 是值班网页

x-logging: &logging
  options: { max-size: "20m", max-file: "5" }    # 每个容器的日志最多 100MB，防止写满硬盘

x-app: &app                                       # 我们自己写的服务都用同一个镜像，只是启动命令不同
  image: tradewatch-app                           # 镜像只由 order-store 打包一次，其他服务直接用
  pull_policy: never                              # 这是我们自己打包的镜像，不要去网上下载
  restart: unless-stopped
  environment: &app-env
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    KAFKA_BOOTSTRAP: kafka:9092
    SPEED: ${SPEED:-1}                            # 1 = 真实速度（1 分钟一根 K 线）
    TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
  volumes:
    - ./data:/app/data                            # 行情 CSV、券商对账单、复盘报告都在服务器的 data/ 里
  depends_on:
    postgres: { condition: service_started }
    kafka: { condition: service_healthy }
  logging: *logging

services:
  # ---------- 公司的基础设施 ----------
  postgres:                                       # 交易数据库
    image: postgres:16
    container_name: tw-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tradewatch
      POSTGRES_USER: tradewatch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: America/New_York
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro      # 数据卷是空的时候自动建表
    ports:
      - "127.0.0.1:5432:5432"
    logging: *logging

  kafka:                                          # 消息总线：服务之间所有的消息都经过它
    image: apache/kafka:3.8.0
    container_name: tw-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller      # KRaft 模式：不需要 ZooKeeper
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_LOG_RETENTION_HOURS: 48               # 消息保留 2 天
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms512m"        # 限制内存
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    logging: *logging

  loki:                                           # 日志平台：集中存放所有容器的日志
    image: grafana/loki:3.0.0
    container_name: tw-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    logging: *logging

  promtail:                                       # 日志收集器：读每个容器的日志，送进 Loki
    image: grafana/promtail:3.0.0
    container_name: tw-promtail
    restart: unless-stopped
    depends_on: [loki]
    command: -config.file=/etc/promtail/promtail.yml
    volumes:
      - ./loki/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    logging: *logging

  grafana:                                        # 值班屏幕
    image: grafana/grafana:11.2.0
    container_name: tw-grafana
    restart: unless-stopped
    depends_on: [postgres, loki]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/desk.json
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: America/New_York
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    logging: *logging

  backup:                                         # 每天备份一次数据库到 ./backups，保留 7 天
    image: postgres:16
    container_name: tw-backup
    restart: unless-stopped
    depends_on: [postgres]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      TZ: America/New_York
    entrypoint: ["sh", "/backup.sh"]
    volumes:
      - ./tools/backup.sh:/backup.sh:ro
      - ./backups:/backups
    logging: *logging

  # ---------- 交易系统（开发团队写的，你值班时不改它） ----------
  market-data:
    <<: *app
    container_name: tw-market-data
    command: python -m services.market_data

  oms:                                            # C# 写的：策略 + 风控 + 订单管理
    <<: *app
    build: { context: ., dockerfile: Dockerfile.dotnet, target: trading }
    image: tradewatch-trading
    pull_policy: build
    container_name: tw-oms
    command: ["oms"]

  ems:                                            # C# 写的：TWAP 执行算法（和 oms 用同一个镜像）
    <<: *app
    image: tradewatch-trading
    container_name: tw-ems
    command: ["ems"]

  fix-gateway:
    <<: *app
    container_name: tw-fix-gateway
    command: python -m services.fix_gateway

  order-store:
    <<: *app
    build: .                                      # 只在这里打包镜像（多个服务同时打包同一个镜像会冲突）
    pull_policy: build
    container_name: tw-order-store
    command: python -m services.order_store

  # ---------- 外面的世界（真实工作里不归你管） ----------
  broker-sim:                                     # 两家券商
    <<: *app
    container_name: tw-broker-sim
    command: python -m services.broker_sim

  chaos:                                          # "现实世界"：随机制造意外（不要看它的代码和 data/chaos/）
    <<: *app
    container_name: tw-chaos
    command: python chaos.py
    environment:
      FAULT_GAP_MIN: ${FAULT_GAP_MIN:-20}         # 两次意外之间最少隔多少分钟
      FAULT_GAP_MAX: ${FAULT_GAP_MAX:-60}         # 最多隔多少分钟
    depends_on: []

  # ---------- 值班工具 ----------
  monitor:                                        # 告警系统
    <<: *app
    container_name: tw-monitor
    command: python -m services.monitor

  copilot:                                        # AI 值班助手：告警 → 归并成事故 → 取证 → AI 诊断 → 复核 → 建议（人批准）
    <<: *app
    container_name: tw-copilot
    command: python -m copilot.main
    environment: &ai-env
      <<: *app-env
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}     # 不填也能跑：只用规则判断，不调用 AI
      COPILOT_MODEL: ${COPILOT_MODEL:-claude-sonnet-5-5}
      COPILOT_DAILY_BUDGET_USD: ${COPILOT_DAILY_BUDGET_USD:-3}
      COPILOT_AUTONOMY: ${COPILOT_AUTONOMY:-suggest}  # read = 只调查；suggest = 可以建议操作（要人批准才执行）
      LOKI_URL: http://loki:3100
    volumes: &ai-volumes
      - ./data:/app/data
      - ./docs:/app/docs                          # 读 runbook；事故关闭后把记录草稿写到 docs/incidents/drafts/

  console:                                        # 值班控制台网页：ASP.NET（C#）后端 + Angular 前端
    <<: *app
    build: { context: ., dockerfile: Dockerfile.dotnet, target: console }
    image: tradewatch-console
    pull_policy: build
    container_name: tw-console
    ports:
      - "127.0.0.1:8080:8080"                     # VS Code 里 forward 8080 端口，浏览器打开 http://localhost:8080

  # ---------- 备用：Python 版的 OMS / EMS（C# 版出问题时切换用，平时不启动）----------
  #   切换：docker compose stop oms ems && docker compose --profile python-core up -d oms-py ems-py
  #   切回：docker compose stop oms-py ems-py && docker compose up -d oms ems
  oms-py:
    <<: *app
    container_name: tw-oms-py
    profiles: ["python-core"]
    command: python -m services.oms

  ems-py:
    <<: *app
    container_name: tw-ems-py
    profiles: ["python-core"]
    command: python -m services.ems

  tools:                                          # 命令行工具：./tw status（用的时候临时启动，用完就删）
    <<: *app
    restart: "no"
    profiles: ["tools"]
    command: python -m tools.tw help
    environment: *ai-env                          # ./tw ai-replay 也要能调用 AI
    volumes: *ai-volumes

volumes:
  pgdata:
  loki-data:
  grafana-data:
