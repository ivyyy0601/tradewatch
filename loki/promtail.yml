# Promtail：把每个容器打出来的日志收集起来，送进 Loki
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
    pipeline_stages:
      # 我们的日志是一行一条 JSON，把 level 和 service 取出来当作标签，方便筛选
      - json:
          expressions:
            level: level
            service: service
      - labels:
          level:
          service:
